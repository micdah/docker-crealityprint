# Build, test and publish the Creality Print image.
#
# Job graph (jobs on the same row run in parallel):
#
#   lint ─────────────────────────────┐
#   build ──┬── smoke ────────────────┼── ci-ok ── publish (master / schedule / manual only)
#           └── e2e (one job per spec)┤
#                                     └── report (merged HTML report with screenshots → GitHub Pages)
#
# The image is built once and passed to the test jobs as an artifact, and publish pushes that
# exact tested image. ci-ok is the single status check to require in branch protection.

name: build

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly uncached rebuild to pick up Debian security updates for the packages we add.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LOCAL_IMAGE: crealityprint:ci
  IMAGE_ARTIFACT: crealityprint-image
  IMAGE_ARCHIVE: crealityprint-image.tar.zst

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.4 -color

      - name: shellcheck (shell scripts)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            build/fetch-crealityprint.sh \
            tests/smoke.sh \
            tests/run-e2e.sh \
            tests/e2e-summary.sh \
            tests/wait-for-published-file.sh \
            root/usr/local/bin/crealityprint \
            root/usr/local/bin/crealityprint-open \
            root/usr/local/bin/crealityprint-seed-config \
            root/usr/local/bin/crealityprint-upload-watcher \
            root/etc/s6-overlay/s6-rc.d/init-crealityprint-config/run \
            root/etc/s6-overlay/s6-rc.d/svc-crealityprint-upload-watcher/run \
            root/etc/s6-overlay/s6-rc.d/svc-dbus/run

      - name: hadolint (Dockerfiles)
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 < tests/e2e/Dockerfile

      - name: Renovate config
        run: |
          docker run --rm -v "$PWD:/usr/src/app" -w /usr/src/app \
            --entrypoint renovate-config-validator \
            renovate/renovate:41 --strict renovate.json

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the Creality Print version
        id: version
        run: |
          version="$(sed -n 's/^ARG CREALITYPRINT_VERSION=v//p' Dockerfile)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Named after the repository (lowercased by metadata-action), e.g. ghcr.io/micdah/docker-crealityprint.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}-r${{ github.run_number }}
          # These override the Dockerfile labels (and metadata-action's repo-derived defaults).
          labels: |
            org.opencontainers.image.title=Creality Print
            org.opencontainers.image.description=Creality Print slicer in the browser via Selkies
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-r${{ github.run_number }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}-r${{ github.run_number }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          # The weekly run skips the layer cache so the image's own Debian packages (webkit
          # and friends) pick up security fixes; base image updates come via Renovate PRs.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Compress the image
        run: zstd -T0 -3 --rm "${{ runner.temp }}/image.tar" -o "${{ runner.temp }}/${IMAGE_ARCHIVE}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.IMAGE_ARCHIVE }}
          retention-days: 1
          compression-level: 0

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: zstd -d --stdout "${{ runner.temp }}/${IMAGE_ARCHIVE}" | docker load

      - name: Smoke test
        run: tests/smoke.sh "$LOCAL_IMAGE"

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per spec file. gpu.spec.js needs /dev/dri, which hosted runners don't have.
        spec: [seed, persistence, transfer, watcher, clipboard]
    name: e2e (${{ matrix.spec }})
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: |
          zstd -d --stdout "${{ runner.temp }}/${IMAGE_ARCHIVE}" | docker load
          rm "${{ runner.temp }}/${IMAGE_ARCHIVE}"

      - name: Run ${{ matrix.spec }} specs
        env:
          CI: "true"
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
          E2E_REPORT_NAME: ${{ matrix.spec }}
        run: tests/run-e2e.sh "$LOCAL_IMAGE" --spec "${{ matrix.spec }}" --workers 1

      - name: Job summary
        if: always()
        run: |
          tests/e2e-summary.sh "${{ runner.temp }}/e2e-artifacts/results.json" "e2e: ${{ matrix.spec }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.spec }}
          # The blob report and the smoke screenshot go in their own artifacts below; don't
          # store them twice.
          path: |
            ${{ runner.temp }}/e2e-artifacts
            !${{ runner.temp }}/e2e-artifacts/blob
            !${{ runner.temp }}/e2e-artifacts/smoke
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.spec }}
          path: ${{ runner.temp }}/e2e-artifacts/blob
          retention-days: 1
          if-no-files-found: ignore

      # The screenshot for the PR comment (only the watcher spec takes one; see lib/evidence.js).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.spec }}
          path: ${{ runner.temp }}/e2e-artifacts/smoke
          retention-days: 1
          if-no-files-found: ignore

  # Merge the per-spec reports into one HTML report (a screenshot of each visible check inline)
  # and publish it to GitHub Pages: pr-<number>/ for PRs, <branch>/ otherwise. The PR gets a
  # sticky comment that always names the commit it describes, including when no report could be
  # made (e.g. the build failed), and embeds the watcher spec's screenshot of the app with a
  # model loaded as a quick smoke check. Skipped for fork PRs (their token can't push) and for the
  # weekly schedule (nothing new to review). Not part of ci-ok: publishing shouldn't block.
  report:
    needs: [build, e2e]
    if: >-
      always()
      && github.event_name != 'schedule'
      && needs.e2e.result != 'cancelled'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          merge-multiple: true
          path: ${{ runner.temp }}/blobs

      # Matches nothing when the watcher spec never got to its screenshot; that's not an error.
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          merge-multiple: true
          path: ${{ runner.temp }}/smoke

      # No blobs means the e2e jobs never ran (build failed) or died before reporting.
      - name: Check for test results
        id: blobs
        run: |
          if compgen -G "${{ runner.temp }}/blobs/*.zip" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.blobs.outputs.found == 'true'
        with:
          node-version: 22

      - name: Install the Playwright reporter
        if: steps.blobs.outputs.found == 'true'
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      - name: Merge the reports
        if: steps.blobs.outputs.found == 'true'
        working-directory: tests/e2e
        env:
          E2E_MERGED_REPORT_DIR: ${{ runner.temp }}/site
        run: |
          npx playwright merge-reports --config merge.config.js "${{ runner.temp }}/blobs"
          test -f "${{ runner.temp }}/site/index.html"

      - name: Work out where the report goes
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            directory="pr-${PR_NUMBER}"
          else
            directory="${GITHUB_REF_NAME//\//-}"
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "directory=${directory}" >> "$GITHUB_OUTPUT"
          echo "url=https://${owner}.github.io/${REPO_NAME}/${directory}/" >> "$GITHUB_OUTPUT"

      # Publish the app screenshot (the watcher spec's, with a model loaded) next to the report.
      - name: Add the app screenshot to the report
        id: smoke
        if: steps.blobs.outputs.found == 'true'
        env:
          SMOKE_DIR: ${{ runner.temp }}/smoke
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          if [ -f "${SMOKE_DIR}/smoke.png" ]; then
            cp "${SMOKE_DIR}/smoke.png" "${SITE_DIR}/smoke.png"
            caption="$(head -n 1 "${SMOKE_DIR}/caption.txt" 2> /dev/null || true)"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "caption=${caption:-Creality Print running in the browser}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Replaces only this report's folder (keep_files off cleans destination_dir); other
      # PRs' and branches' folders are left alone. Pinned: this action gets a write token.
      - name: Publish to GitHub Pages
        if: steps.blobs.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/site
          destination_dir: ${{ steps.target.outputs.directory }}
          commit_message: "e2e report for ${{ steps.target.outputs.directory }} (${{ github.sha }})"

      # Pages deploys a minute or so after the push; comment only once it serves this run's
      # screenshot, or GitHub's image proxy picks up the old one. A slow deploy only costs a
      # warning, never the comment.
      # The step timeout backs up the script's own: this job holds the repo-wide gh-pages lock.
      - name: Wait for Pages to serve the app screenshot
        id: wait
        if: steps.smoke.outputs.found == 'true'
        continue-on-error: true
        timeout-minutes: 7
        env:
          REPORT_URL: ${{ steps.target.outputs.url }}
          SMOKE_FILE: ${{ runner.temp }}/site/smoke.png
        run: tests/wait-for-published-file.sh "${REPORT_URL}smoke.png" "$SMOKE_FILE"

      # Embed the image only once Pages serves this run's file: GitHub's image proxy caches what it
      # first fetches, so an early comment would keep showing the old screenshot (or a 404).
      - name: Prepare the app screenshot Markdown
        id: smoke_markdown
        if: steps.blobs.outputs.found == 'true'
        env:
          REPORT_URL: ${{ steps.target.outputs.url }}
          SCREENSHOT_FOUND: ${{ steps.smoke.outputs.found }}
          SCREENSHOT_CAPTION: ${{ steps.smoke.outputs.caption }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
        run: |
          # Scoped to this run, so the comment never shows the proxy's cached image of an earlier run.
          image_url="${REPORT_URL}smoke.png?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$SCREENSHOT_FOUND" != "true" ]; then
            markdown="⚠️ No app screenshot: the watcher spec didn't reach its model-loaded check."
          elif [ "$WAIT_OUTCOME" = "success" ]; then
            alt_text="${SCREENSHOT_CAPTION//[\[\]]/}"
            markdown="[![${alt_text}](${image_url})](${REPORT_URL})"$'\n\n'"<sub>${SCREENSHOT_CAPTION} (watcher spec)</sub>"
          else
            markdown="⚠️ GitHub Pages didn't deploy in time to embed the app screenshot: [open it](${image_url}) (${SCREENSHOT_CAPTION})."
          fi
          {
            echo "markdown<<SMOKE_MARKDOWN_EOF"
            echo "$markdown"
            echo "SMOKE_MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: steps.blobs.outputs.found == 'true'
        env:
          REPORT_URL: ${{ steps.target.outputs.url }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SMOKE_MARKDOWN: ${{ steps.smoke_markdown.outputs.markdown }}
        run: |
          {
            echo "### e2e report with screenshots"
            echo
            echo "Result: **${E2E_RESULT}** for ${COMMIT_SHA}. Report: ${REPORT_URL}"
            echo "(GitHub Pages may need a minute to deploy.)"
            echo
            echo "$SMOKE_MARKDOWN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR (report published)
        if: github.event_name == 'pull_request' && steps.blobs.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: e2e-report
          message: |
            ### e2e report with screenshots

            ${{ needs.e2e.result == 'success' && '✅ All e2e specs passed' || '❌ Some e2e specs failed' }} for commit ${{ env.COMMIT_SHA }}.

            ${{ steps.smoke_markdown.outputs.markdown }}

            **[Open the report](${{ steps.target.outputs.url }})**: click a test to see a screenshot of each visible check.

            [Workflow run](${{ env.RUN_URL }}). GitHub Pages may need a minute to deploy.

      - name: Comment on the PR (no report)
        if: >-
          always() && github.event_name == 'pull_request'
          && (steps.blobs.outputs.found != 'true' || failure())
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: e2e-report
          message: |
            ### e2e report with screenshots

            ⚠️ No e2e report could be published for commit ${{ env.COMMIT_SHA }} (build: ${{ needs.build.result }}, e2e: ${{ needs.e2e.result }}).
            See the [workflow run](${{ env.RUN_URL }}) for details.

  ci-ok:
    needs: [lint, smoke, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  publish:
    needs: [build, ci-ok]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load the tested image
        run: zstd -d --stdout "${{ runner.temp }}/${IMAGE_ARCHIVE}" | docker load

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
          done
