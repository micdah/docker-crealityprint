# Build, test and publish the Creality Print image.
#
# Job graph (jobs on the same row run in parallel):
#
#   lint ─────────────────────────────┐
#   build ──┬── smoke ────────────────┼── ci-ok ── publish (master / schedule / manual only)
#           └── e2e (one job per spec)┘
#
# The image is built once and passed to the test jobs as an artifact, and publish pushes that
# exact tested image. ci-ok is the single status check to require in branch protection.

name: build

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly uncached rebuild to pick up Debian security updates for the packages we add.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LOCAL_IMAGE: crealityprint:ci
  IMAGE_ARTIFACT: crealityprint-image
  IMAGE_ARCHIVE: crealityprint-image.tar.zst

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.4 -color

      - name: shellcheck (shell scripts)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            build/fetch-crealityprint.sh \
            tests/smoke.sh \
            tests/run-e2e.sh \
            tests/e2e-summary.sh \
            root/usr/local/bin/crealityprint \
            root/usr/local/bin/crealityprint-open \
            root/usr/local/bin/crealityprint-seed-config \
            root/usr/local/bin/crealityprint-upload-watcher \
            root/etc/s6-overlay/s6-rc.d/init-crealityprint-config/run \
            root/etc/s6-overlay/s6-rc.d/svc-crealityprint-upload-watcher/run \
            root/etc/s6-overlay/s6-rc.d/svc-dbus/run

      - name: hadolint (Dockerfiles)
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 < tests/e2e/Dockerfile

      - name: Renovate config
        run: |
          docker run --rm -v "$PWD:/usr/src/app" -w /usr/src/app \
            --entrypoint renovate-config-validator \
            renovate/renovate:41 --strict renovate.json

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the Creality Print version
        id: version
        run: |
          version="$(sed -n 's/^ARG CREALITYPRINT_VERSION=v//p' Dockerfile)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/crealityprint
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}-r${{ github.run_number }}
          # These override the Dockerfile labels (and metadata-action's repo-derived defaults).
          labels: |
            org.opencontainers.image.title=Creality Print
            org.opencontainers.image.description=Creality Print slicer in the browser via Selkies
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-r${{ github.run_number }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}-r${{ github.run_number }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          # The weekly run skips the layer cache so the image's own Debian packages (webkit
          # and friends) pick up security fixes; base image updates come via Renovate PRs.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Compress the image
        run: zstd -T0 -3 --rm "${{ runner.temp }}/image.tar" -o "${{ runner.temp }}/${IMAGE_ARCHIVE}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.IMAGE_ARCHIVE }}
          retention-days: 1
          compression-level: 0

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: zstd -d --stdout "${{ runner.temp }}/${IMAGE_ARCHIVE}" | docker load

      - name: Smoke test
        run: tests/smoke.sh "$LOCAL_IMAGE"

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per spec file. gpu.spec.js needs /dev/dri, which hosted runners don't have.
        spec: [seed, persistence, transfer, watcher, clipboard]
    name: e2e (${{ matrix.spec }})
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: |
          zstd -d --stdout "${{ runner.temp }}/${IMAGE_ARCHIVE}" | docker load
          rm "${{ runner.temp }}/${IMAGE_ARCHIVE}"

      - name: Run ${{ matrix.spec }} specs
        env:
          CI: "true"
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: tests/run-e2e.sh "$LOCAL_IMAGE" --spec "${{ matrix.spec }}" --workers 1

      - name: Job summary
        if: always()
        run: |
          tests/e2e-summary.sh "${{ runner.temp }}/e2e-artifacts/results.json" "e2e: ${{ matrix.spec }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.spec }}
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14

  ci-ok:
    needs: [lint, smoke, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  publish:
    needs: [build, ci-ok]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load the tested image
        run: zstd -d --stdout "${{ runner.temp }}/${IMAGE_ARCHIVE}" | docker load

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
          done
