# Example: Creality Print in the browser. Copy to docker-compose.yml and adjust.
# Open https://<host>:3001 (HTTPS is required; plain HTTP shows a black page).
services:
  crealityprint:
    # Pin a version tag (e.g. :7.3.2) instead of :latest if you want to control upgrades yourself.
    image: ghcr.io/micdah/docker-crealityprint:latest
    container_name: crealityprint
    environment:
      - PUID=1000                         # your user's id (`id -u`)
      - PGID=1000                         # your user's group id (`id -g`)
      - TZ=Europe/Copenhagen
      # First run only: skip the setup wizard with this printer and its default presets.
      # - CP_PRINTER=Creality K1C
      # - CP_NOZZLE=0.4
      # - CP_REGION=Europe
      # HiDPI screen (4K, Retina): draw the app at 2x so it is big *and* sharp. This also fixes
      # Selkies' own UI Scaling at 100 % (SELKIES_SCALING_DPI=96), which would blur it.
      # - CP_UI_SCALE=2
      # Add uploaded/dropped models straight to the open plate.
      # - AUTO_OPEN_UPLOADS=true
      # Close the app while no browser is connected (saves idle CPU and memory; it starts again
      # when you connect, and offers to restore unsaved work).
      # - IDLE_QUIT=true
      # - IDLE_QUIT_AFTER=1800            # seconds with no browser before closing
      # Protect the UI and the file API with a login (strongly recommended beyond localhost).
      # - PASSWORD=change-me
      # Turn browser upload/download off completely.
      # - SELKIES_FILE_TRANSFERS=none
    volumes:
      - ./config:/config                  # all settings, presets, login and projects
      # A NAS folder that shows up in the Files panel and in the app's file dialogs:
      # - /mnt/nas/3d-models:/config/Desktop/nas
    ports:
      - 3001:3001
    devices:
      - /dev/dri:/dev/dri                 # Intel/AMD GPU; remove this line for CPU-only hosts
    shm_size: "1gb"
    # Bridge networking works for printers added by IP (status, upload, camera).
    # Automatic printer discovery needs host networking plus a firewall rule for mDNS:
    # network_mode: host
    restart: unless-stopped
